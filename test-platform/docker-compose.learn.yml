services:
  mysql:
    image: mysql:5.7
    container_name: tp-learn-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: test_platform
    volumes:
      - mysql_learn_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    ports:
      - "3309:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile-learn
    container_name: tp-learn-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:-learn-only-secret-change-me-32-chars-ok}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_PASSWORD: 1234
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-learn
    container_name: tp-learn-frontend
    ports:
      - "82:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_learn_data:
