server:
  port: 8080
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://localhost:3306/test_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 2
    baseline-on-migrate: true
jwt:
  secret: ${JWT_SECRET:}
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:80
    - http://localhost:81
    - http://localhost:82
ci:
  api-key: ${CI_API_KEY:}
ssrf:
  allow-internal: false
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
ai:
  agnes:
    api-key: ${AGNES_API_KEY}
    base-url: https://apihub.agnes-ai.com/v1
    model: agnes-2.0-flash
logging:
  level:
    com.testplatform: DEBUG
    org.springframework: WARN